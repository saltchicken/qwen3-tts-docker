[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-tts-client"
version = "0.1.0"
description = "Python client SDK for the Qwen3-TTS Docker microservice"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "sounddevice>=0.4.6",
]

[tool.setuptools]
# This tells setuptools to only install client.py as a module, 
# ignoring server.py and other repo files.
py-modules = ["client"]
